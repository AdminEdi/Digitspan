<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digit Span Test</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Alice&family=Sahel:wght@400;700&display=swap');

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #fff;
      font-family: 'Alice', 'Sahel', serif; 
      direction: rtl;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #container {
      width: 100%;
      max-width: 450px;
      padding: 20px;
      box-sizing: border-box;
    }

    h2 { margin: 0; font-size: 24px; text-align: center; }

    #grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-gap: 4vw;
      justify-items: center;
      margin: 20px 0;
    }

    .cell {
      width: 24vw;
      height: 24vw;
      font-size: 10vw;
      background: #aaa;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
      color: #fff;
      transition: transform 0.1s, background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cell.active { background: #f1c40f; transform: scale(1.2); }

    button, .site-link {
      padding: 10px 20px;
      font-size: 17px;
      border: none;
      border-radius: 4px;
      background: #1e83c6;
      color: #fff;
      cursor: pointer;
      font-family: inherit;
      display: inline-block;
      margin-top: 5px;
      text-decoration: none;
      text-align: center;
      transition: background 0.3s;
    }

    #skipBtn {
      background-color: #469eeb;
      margin-top: 10px;
      font-size: 16px;
      display: none;
    }

    #info, #prompt, #result p { text-align: center; margin: 10px 0; }
    #prompt { height: 24px; }
    #result { text-align: center; display: none; }
    
    /* درشت‌تر کردن متن پایان آزمون */
    .result-text { font-size: 18px; line-height: 1.8; }

    @media (min-width: 600px) {
      .cell { width: 90px; height: 90px; font-size:18px; }
      #grid { grid-gap: 10px; }
    }
  </style>
</head>
<body>
  <div id="container">
    <h2>Digit Span Test</h2>

    <div id="intro" style="text-align: center;">
      <p style="font-size: 18px;">توالی اعداد را به خاطر بسپار و سپس تکرار کن.</p><br>
      <button id="startBtn">شروع آزمون</button>
      <p style="margin-top: 10px;">
        <a href="https://adminedi.github.io/Polarisacademy/#" target="_blank" class="site-link">
            لینک سایت Polarisacademy
        </a>
      </p>
    </div>

    <div id="test" style="display:none;">
      <div id="info">مرحله <span id="trialNum">1</span> از 10</div>
      <div id="grid">
        <div class="cell" data-val="1">1</div>
        <div class="cell" data-val="2">2</div>
        <div class="cell" data-val="3">3</div>
        <div class="cell" data-val="4">4</div>
        <div class="cell" data-val="5">5</div>
        <div class="cell" data-val="6">6</div>
        <div class="cell" data-val="7">7</div>
        <div class="cell" data-val="8">8</div>
        <div class="cell" data-val="9">9</div>
      </div>
      <div id="prompt">منتظر توالی باشید...</div>
      <div style="text-align: center;">
        <button id="skipBtn">یادم نیست، برو بعدی</button>
      </div>
    </div>

    <div id="result">
      <p class="result-text">آزمون به پایان رسید!</p>
      <p class="result-text">تعداد پاسخ صحیح: <span id="score"></span> از 10</p><br>
      <button id="retryBtn">تکرار آزمون</button>
      <p style="margin-top:10px;">
        <a href="https://adminedi.github.io/Polarisacademy/#" target="_blank" class="site-link">
            لینک سایت Polarisacademy
        </a>
      </p>
    </div>
  </div>

  <script>
    const TOTAL_TRIALS = 10;
    let sequence = [], userSeq = [], trial = 0, score = 0;

    const startBtn = document.getElementById('startBtn');
    const retryBtn = document.getElementById('retryBtn');
    const skipBtn  = document.getElementById('skipBtn');
    const introEl  = document.getElementById('intro');
    const testEl   = document.getElementById('test');
    const resultEl = document.getElementById('result');
    const gridEls  = document.querySelectorAll('.cell');
    const trialNum = document.getElementById('trialNum');
    const promptEl = document.getElementById('prompt');
    const scoreEl  = document.getElementById('score');

    // تابع تبدیل عدد به فارسی حذف شد تا اعداد انگلیسی بمانند

    startBtn.onclick = () => {
      introEl.style.display  = 'none';
      resultEl.style.display = 'none';
      testEl.style.display   = 'block';
      trial = 0; score = 0;
      nextTrial();
    };

    retryBtn.onclick = () => {
      introEl.style.display  = 'block';
      resultEl.style.display = 'none';
    };

    skipBtn.onclick = () => {
      if (promptEl.textContent === 'در حال نمایش ...') return;
      if (trial < TOTAL_TRIALS) {
        promptEl.textContent = 'در حال انتقال ...';
        setTimeout(nextTrial, 500);
      } else {
        endTest();
      }
    };

    gridEls.forEach(cell => {
      cell.onclick = () => {
        if (promptEl.textContent !== 'نوبت شماست!') return;
        userSeq.push(cell.dataset.val);
        flash(cell);
        if (userSeq.length === sequence.length) {
          setTimeout(checkAnswer, 300);
        }
      };
    });

    function nextTrial() {
      trial++;
      trialNum.textContent = trial; // نمایش عدد انگلیسی
      userSeq = [];
      skipBtn.style.display = 'none';
      
      const spanLength = 4 + Math.floor((trial - 1) / 2);
      sequence = Array.from({length: spanLength}, () =>
        String(Math.floor(Math.random() * 9) + 1)
      );
      promptEl.textContent = 'در حال نمایش ...';
      playSequence(0);
    }

    function playSequence(i) {
      if (i >= sequence.length) {
        setTimeout(() => {
            promptEl.textContent = 'نوبت شماست!';
            skipBtn.style.display = 'inline-block';
        }, 500);
        return;
      }
      const val = sequence[i];
      const cell = [...gridEls].find(c => c.dataset.val === val);
      flash(cell);
      setTimeout(() => playSequence(i + 1), 700);
    }

    function flash(cell) {
      cell.classList.add('active');
      setTimeout(() => cell.classList.remove('active'), 400);
    }

    function checkAnswer() {
      if (sequence.every((v,i) => v === userSeq[i])) score++;
      if (trial < TOTAL_TRIALS) {
        promptEl.textContent = 'منتظر توالی باشید...';
        setTimeout(nextTrial, 500);
      } else {
        endTest();
      }
    }

    function endTest() {
      testEl.style.display   = 'none';
      scoreEl.textContent    = score; // نمایش امتیاز انگلیسی
      resultEl.style.display = 'block';
    }
  </script>
</body>
</html>
